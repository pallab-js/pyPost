[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypost"
version = "1.0.0"
description = "A fast, intuitive, and extensible open-source API testing tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "pyPost Team"}
]
keywords = ["api", "testing", "http", "rest", "graphql", "websocket", "postman", "alternative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "cryptography>=41.0.0",
    "pygments>=2.13.0",
    "websockets>=10.0",
    "flask>=2.0.0",
    "faker>=19.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "pytest-mock",
    "pytest-qt",
    "black",
    "isort",
    "flake8",
]

[project.scripts]
pypost = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "engine*", "adapters*", "integrations*", "plugins*", "security*", "utils*", "cli*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["test_*.py"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
